# Local PostgreSQL for the production-platform slice (NOT needed for the
# hackathon app on main — anonymous local-first mode never touches this).
# Usage: docker compose -f docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: sofer-postgres
    environment:
      POSTGRES_USER: sofer
      POSTGRES_PASSWORD: sofer-dev-only
      POSTGRES_DB: sofer
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sofer-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sofer -d sofer"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  sofer-pgdata:
