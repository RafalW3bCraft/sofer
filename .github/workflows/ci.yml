name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install (root)
        run: npm ci

      - name: Install (client)
        run: npm --prefix client ci

      - name: Install (server)
        run: npm --prefix server ci

      - name: Validate lesson content
        run: npm run validate:lessons

      - name: Validate alphabet content
        run: npm run validate:alphabet

      - name: TypeScript checks (client + server)
        run: npm run check

      - name: Unit + integration tests (Vitest)
        run: npm test

      - name: Production build (client + server)
        run: npm run build

      - name: Hygiene (no secrets / forbidden paths)
        run: npm run hygiene

      - name: Production smoke (built server serves SPA + API)
        run: |
          PORT=3101 NODE_ENV=production node server/dist/index.js &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:3101/api/health > /dev/null && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:3101/api/health | grep '"ok":true'
          for path in / /lessons /lessons/greetings-1 /alphabet /progress; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3101$path)
            [ "$code" = "200" ] || { echo "FAIL $path -> $code"; exit 1; }
          done
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3101/api/unknown)
          [ "$code" = "404" ] || { echo "FAIL /api/unknown -> $code"; exit 1; }
          curl -fsS http://127.0.0.1:3101/lessons/greetings-1 | grep -q '<div id="root">'
          echo "production smoke OK"

  e2e:
    name: e2e (playwright, node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install (root)
        run: npm ci

      - name: Install (client)
        run: npm --prefix client ci

      - name: Install Playwright Chromium (with OS deps)
        run: npx playwright install --with-deps chromium

      - name: Browser E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
