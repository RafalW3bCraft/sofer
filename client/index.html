<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="sofer — a calm, accessible web app that teaches Modern Standard Arabic to complete beginners through tappable tokens on real sentences." />
    <meta name="theme-color" content="#FAF8F4" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Self-hosted Arabic webfont (Noto Naskh Arabic, Arabic Unicode subset,
      OFL-licensed): ensures consistent glyph rendering on machines that
      don't ship with an MSA system font. Loaded via @font-face in
      src/styles/global.css with font-display: swap; the system-font
      fallback list in --font-arabic (tokens.css) still applies if the
      file can't be fetched. No third-party font CDN is contacted.
    -->
    <title>sofer — Learn your first Arabic sentences</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
